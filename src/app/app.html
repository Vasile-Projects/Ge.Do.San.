@if (!suRottaAdmin()) {
  <a class="skip-link" href="#contenuto">Salta al contenuto</a>
  <app-public-header [overlay]="headerOverlay()" [azione]="azione()" />
}

<div class="app-main">
  <router-outlet />
</div>

@if (!suRottaAdmin()) {
  <app-public-footer
    [centri]="trasfusionali.centri()"
    [contattiIndisponibili]="trasfusionali.elencoStato().status === 'error'"
  />
}

@if (errorBus.last(); as err) {
  <app-error-toast [messaggio]="err.message" (chiudi)="errorBus.clear()" />
}
