@if (aperto()) {
  <div
    #box
    id="assistente-telegram"
    class="assistente__box"
    role="dialog"
    aria-labelledby="assistente-telegram-titolo"
    tabindex="-1"
  >
    <div class="assistente__testa">
      <h2 id="assistente-telegram-titolo" class="assistente__titolo">Assistente Gedosan</h2>
      <button
        type="button"
        class="assistente__chiudi"
        (click)="chiudi()"
        aria-label="Chiudi l'assistente"
      >
        <app-icon name="close" [size]="18" />
      </button>
    </div>
    <p class="assistente__testo">
      Chiedimi centri, orari liberi e quando puoi donare. Se hai già donato con noi, puoi anche
      prenotare.
    </p>
    <app-button
      label="Apri su Telegram"
      variant="primary"
      icon="send"
      iconPosition="start"
      [block]="true"
      [href]="telegramUrl"
      ariaLabel="Apri l'assistente su Telegram (si apre in una nuova scheda)"
    />
  </div>
}

<button
  #pulsante
  type="button"
  class="assistente__pulsante"
  [attr.aria-expanded]="aperto()"
  aria-controls="assistente-telegram"
  (click)="alterna()"
>
  <app-icon [name]="aperto() ? 'close' : 'telegram'" [size]="26" />
  <span class="visually-hidden">Assistente Gedosan su Telegram</span>
</button>
