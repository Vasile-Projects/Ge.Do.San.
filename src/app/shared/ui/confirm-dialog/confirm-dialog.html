<div class="confirm-dialog__backdrop" (click)="annulla.emit()"></div>

<div
  class="confirm-dialog__panel"
  role="dialog"
  aria-modal="true"
  aria-labelledby="confirm-dialog-title"
  aria-describedby="confirm-dialog-msg"
>
  <h2 id="confirm-dialog-title" class="confirm-dialog__title">{{ titolo() }}</h2>
  <p id="confirm-dialog-msg" class="confirm-dialog__msg">{{ messaggio() }}</p>
  @if (dettaglio(); as d) {
    <p class="confirm-dialog__detail">{{ d }}</p>
  }

  @if (errore(); as err) {
    <p class="confirm-dialog__error" role="alert">{{ err }}</p>
  }

  <div class="confirm-dialog__actions">
    <app-button
      label="Annulla"
      variant="secondary"
      [disabled]="inCorso()"
      (click)="annulla.emit()"
    />
    <span class="confirm-dialog__confirm" data-autofocus>
      <app-button
        [label]="inCorso() ? 'Attendere…' : etichettaConferma()"
        variant="primary"
        [icon]="distruttiva() ? 'trash' : null"
        iconPosition="start"
        [disabled]="inCorso()"
        (click)="conferma.emit()"
      />
    </span>
  </div>
</div>
