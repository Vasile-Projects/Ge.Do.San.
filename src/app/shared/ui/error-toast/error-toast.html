<div class="error-toast" role="alert">
  <app-icon name="alert" [size]="20" class="error-toast__icon" />
  <p class="error-toast__msg">{{ messaggio() }}</p>
  <button
    type="button"
    class="error-toast__close"
    (click)="chiudi.emit()"
    aria-label="Chiudi l'avviso"
  >
    <app-icon name="close" [size]="18" />
  </button>
</div>
